<!doctype html>
<html lang="en">

<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>crud form</title>
   <script type="module" src="/src/scripts/index.js"></script>
   <link rel="stylesheet" href="src/styles/style.css">
</head>

<body>
   <div style="--i: 2" class="info-block disactivated" data-js-info-block>
   </div>
   <div class="er-diagram-block animation disactivated" data-js-er-diagram-block>
      <svg preserveAspectRatio="xMinYMin meet" viewBox="0 0 1600 1920" xmlns="http://www.w3.org/2000/svg"
         data-js-er-diagram-canvas>
         <defs>
            <filter id="multiShadow" x="-50%" y="-50%" width="200%" height="200%">
               <!-- Белая тень -->
               <feDropShadow dx="-4" dy="-2" stdDeviation="8" flood-color="#ffffff" flood-opacity="1" />
               <!-- Голубая тень -->
               <feDropShadow dx="4" dy="2" stdDeviation="8" flood-color="rgb(95,157,231)" flood-opacity="0.48" />
            </filter>

            <marker id="arrow" markerWidth="5" markerHeight="5" refX="2" refY="2.5" orient="auto">
               <path d="M0,0 L0,5 L5,2.5 z" fill="#dde1e7b9" />
            </marker>
         </defs>

      </svg>
   </div>
   <svg style="display: none">
      <filter id="glass-distortion">
         <feTurbulence type="turbulence" baseFrequency="0.008" numOctaves="2" result="noise" />
         <feDisplacementMap in="SourceGraphic" in2="noise" scale="77" />
      </filter>
   </svg>

   <div class="reflect-container" data-js-reflect-container>
   </div>
   <nav class="navbar scrolled" aria-label="Main menu" data-js-navbar>
      <div class="glass-filter"></div>
      <div class="glass-overlay"></div>
      <div class="glass-specular"></div>
      <button class="burger-btn" aria-label="Open the menu" aria-expanded="false" data-js-navbar-btn>
         <i data-bx="menu"></i>
      </button>
      <ul class="nav-links" role="menubar">
         <li>
            <button data-js-navbar-home-btn>
               <i data-bx="home"></i>
            </button>
         </li>
         <li>
            <button data-js-navbar-add-btn>
               <i data-bx="plus"></i>
            </button>
         </li>
         <li>
            <button data-js-navbar-info-btn>
               <i data-bx="info-circle"></i>
            </button>
         </li>
      </ul>
   </nav>
   <main class="content" data-js>
      <div class="search-list disactivated">
         <div class="glass-filter"></div>
         <div class="glass-overlay"></div>
         <div class="glass-specular"></div>
         <ul data-js-search-list>

         </ul>
      </div>

      <div class="glass-form" data-js-post-form>
         <button class="cancel-btn disactivated" data-js-btn-cancel>&#10060;</button>
         <div class="glass-filter"></div>
         <div class="glass-overlay"></div>
         <div class="glass-specular"></div>
         <form class="glass-content" data-js-post-form-container>

         </form>

      </div>
      <section class="entity-card-slider" data-js-section>
         <div class="container">

         </div>
      </section>
   </main>
</body>

</html>

<!doctype html>
<html lang="en">

<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>crud form</title>
   <script type="module" src="/src/scripts/index.js"></script>
   <link rel="stylesheet" href="src/styles/style.css">
</head>

<body>
   <div class="info-block disactivated" data-js-info-block>
   </div>
   <div class="er-diagram-block disactivated" data-js-er-diagram-block>
      <svg width="100%" height="100%" viewBox="0 0 1200 800">
         <!-- Таблица ucenik -->
         <rect x="50" y="50" width="352" height="420" fill="#f9f9f9" stroke="#333" class="table" />
         <text x="60" y="70" font-size="14">ucenik</text>

         <!-- Таблица osnovna_skola -->
         <rect x="400" y="200" width="200" height="100" fill="#f9f9f9" stroke="#333" />
         <text x="410" y="70" font-size="14">osnovna_skola</text>

         <!-- Связь -->
         <path d="M 250,80 L 400, 80 400,200" stroke="black" fill="transparent" />

         <defs>
            <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
               <path d="M0,0 L0,6 L6,3 z" fill="black" />
            </marker>
         </defs>
      </svg>
   </div>
   <svg style="display: none">
      <filter id="glass-distortion">
         <feTurbulence type="turbulence" baseFrequency="0.008" numOctaves="2" result="noise" />
         <feDisplacementMap in="SourceGraphic" in2="noise" scale="77" />
      </filter>
   </svg>

   <!-- <canvas id="canvas3d"></canvas> -->
   <div class="reflect-container" data-js-reflect-container>
      <div class="backdrop-blur-md" data-js-blur-overlay></div>
   </div>
   <nav class="navbar scrolled" aria-label="Main menu" data-js-navbar>
      <div class="glass-filter"></div>
      <div class="glass-overlay"></div>
      <div class="glass-specular"></div>
      <button class="burger-btn" aria-label="Open the menu" aria-expanded="false" data-js-navbar-btn>
         <i data-bx="menu"></i>
      </button>
      <ul class="nav-links" role="menubar">
         <li>
            <button data-js-navbar-home-btn>
               <i data-bx="home"></i>
            </button>
         </li>
         <li>
            <button data-js-navbar-add-btn>
               <i data-bx="plus"></i>
            </button>
         </li>
         <li>
            <button data-js-navbar-info-btn>
               <i data-bx="info-circle"></i>
            </button>
         </li>
      </ul>
   </nav>
   <main class="content" data-js>
      <div class="search-list disactivated">
         <div class="glass-filter"></div>
         <div class="glass-overlay"></div>
         <div class="glass-specular"></div>
         <ul data-js-search-list>

         </ul>
      </div>

      <div class="glass-form" data-js-post-form>
         <div class="glass-filter"></div>
         <div class="glass-overlay"></div>
         <div class="glass-specular"></div>
         <form class="glass-content" data-js-post-form-container>

         </form>

      </div>
      <section class="entity-card-slider" data-js-section>
         <div class="container">

         </div>
      </section>
   </main>
</body>

</html>

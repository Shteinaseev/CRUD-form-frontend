<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Griddfs</title>
  <style>
    .er-diagram {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin: 40px;
    }

    .table:hover {
      fill: aqua;
      cursor: pointer;
    }

  </style>
</head>

<body>
  <!-- SVG линии -->
  <svg width="100%" height="100%" viewBox="0 0 1200 800">
    <!-- Таблица ucenik -->
    <rect x="50" y="50" width="200" height="120" fill="#f9f9f9" stroke="#333" class="table"/>
    <text x="60" y="70" font-size="14">ucenik</text>

    <!-- Таблица osnovna_skola -->
    <rect x="400" y="200" width="200" height="100" fill="#f9f9f9" stroke="#333" />
    <text x="410" y="70" font-size="14">osnovna_skola</text>

    <!-- Связь -->
    <path d="M 250,80 L 400, 80 400,200" stroke="black" fill="transparent" />

    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
        <path d="M0,0 L0,6 L6,3 z" fill="black" />
      </marker>
    </defs>
  </svg>

</body>

</html>

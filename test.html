<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Griddfs</title>
  <style>
    .er-diagram {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin: 40px;
    }

    .table {
      background: #f9f9f9;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 10px 15px;
      width: 200px;
      box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.2);
    }

    .table h3 {
      margin: 0 0 10px;
      text-align: center;
      font-size: 1.1em;
      color: #222;
    }

    .table ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .table li {
      font-size: 0.9em;
      border-bottom: 1px solid #ddd;
      padding: 4px 0;
    }

    .relations {
      position: absolute;
      top: 0;
      left: 0;
      width: 800px;
      height: 200px;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <!-- SVG линии -->
  <svg width="100%" height="100%" viewBox="0 0 1200 800">
    <!-- Таблица ucenik -->
    <rect x="50" y="50" width="200" height="120" fill="#f9f9f9" stroke="#333" />
    <text x="60" y="70" font-size="14">ucenik</text>

    <!-- Таблица osnovna_skola -->
    <rect x="400" y="200" width="200" height="100" fill="#f9f9f9" stroke="#333" />
    <text x="410" y="70" font-size="14">osnovna_skola</text>

    <!-- Связь -->
    <path d="M 250,80 Q 375,100 400,200" stroke="black" fill="transparent" />

    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
        <path d="M0,0 L0,6 L6,3 z" fill="black" />
      </marker>
    </defs>
  </svg>

</body>

</html>
